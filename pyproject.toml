[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sol-pi-harness"
version = "0.1.0"
description = "Open-source multi-harness toolkit implementing SoL-Pi (arXiv:2609.20519) & Harness2 efficiency loops for Antigravity (AGY), Claude Code, Codex, and Cursor."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "SoL-Pi Open Source Contributors"}
]
keywords = ["ai-agents", "agent-harness", "sol-pi", "mcp", "claude-code", "antigravity", "codex", "token-efficiency"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
solpi = "solpi.cli:main"
solpi-mcp = "solpi.mcp_server:main"
solpi-hook = "solpi.hook_runner:main"

[tool.setuptools.packages.find]
where = ["src"]
