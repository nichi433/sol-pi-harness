<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 260" width="100%" height="260">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a162b" />
      <stop offset="50%" stop-color="#261f42" />
      <stop offset="100%" stop-color="#352554" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff9ecd" />
      <stop offset="50%" stop-color="#c49bff" />
      <stop offset="100%" stop-color="#7ef2e4" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7eb3" />
      <stop offset="100%" stop-color="#8b6bff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="4" y="4" width="912" height="252" rx="22" fill="url(#bgGrad)" stroke="url(#accentGrad)" stroke-width="2.5" />

  <!-- Decorative Sparkles / Stars -->
  <g fill="#ffcfef" opacity="0.7">
    <circle cx="55" cy="45" r="2.5" />
    <circle cx="860" cy="40" r="3" />
    <circle cx="820" cy="215" r="2" />
    <circle cx="310" cy="35" r="2" />
    <text x="68" y="88" font-family="monospace" font-size="16" fill="#ff9ecd">✦</text>
    <text x="265" y="65" font-family="monospace" font-size="14" fill="#7ef2e4">✧</text>
    <text x="850" y="95" font-family="monospace" font-size="18" fill="#ff9ecd">✦</text>
    <text x="875" y="185" font-family="monospace" font-size="14" fill="#c49bff">🐾</text>
    <text x="35" y="210" font-family="monospace" font-size="15" fill="#ff9ecd">🐾</text>
  </g>

  <!-- Cute Nichi (Michi / Cat) Mascot on Left -->
  <g transform="translate(80, 45)">
    <!-- Soft Halo Glow -->
    <circle cx="85" cy="85" r="78" fill="#c49bff" opacity="0.12" filter="url(#glow)" />
    <circle cx="85" cy="85" r="64" fill="#ff9ecd" opacity="0.10" />

    <!-- Left & Right Cat Ears -->
    <polygon points="35,65 25,12 72,42" fill="#2e264e" stroke="#ff9ecd" stroke-width="3" stroke-linejoin="round" />
    <polygon points="40,56 33,24 64,44" fill="#ffb3d9" opacity="0.75" />
    <polygon points="135,65 145,12 98,42" fill="#2e264e" stroke="#ff9ecd" stroke-width="3" stroke-linejoin="round" />
    <polygon points="130,56 137,24 106,44" fill="#ffb3d9" opacity="0.75" />

    <!-- Cat Head -->
    <ellipse cx="85" cy="84" rx="58" ry="48" fill="#2e264e" stroke="#ff9ecd" stroke-width="3" />

    <!-- Cute Blush Cheeks -->
    <ellipse cx="48" cy="92" rx="9" ry="5" fill="#ff7eb3" opacity="0.55" />
    <ellipse cx="122" cy="92" rx="9" ry="5" fill="#ff7eb3" opacity="0.55" />

    <!-- Sparkly Cat Eyes -->
    <ellipse cx="62" cy="78" rx="7.5" ry="9" fill="#ffffff" />
    <ellipse cx="62" cy="79" rx="5.5" ry="7" fill="#18122b" />
    <circle cx="59.5" cy="75.5" r="2.5" fill="#ffffff" />
    <circle cx="64.5" cy="82" r="1.2" fill="#7ef2e4" />

    <ellipse cx="108" cy="78" rx="7.5" ry="9" fill="#ffffff" />
    <ellipse cx="108" cy="79" rx="5.5" ry="7" fill="#18122b" />
    <circle cx="105.5" cy="75.5" r="2.5" fill="#ffffff" />
    <circle cx="110.5" cy="82" r="1.2" fill="#7ef2e4" />

    <!-- Cute "w" Cat Nose & Mouth (uwu style) -->
    <polygon points="82,86 88,86 85,90" fill="#ff9ecd" />
    <path d="M 75 93 Q 80 99 85 92 Q 90 99 95 93" fill="none" stroke="#ffcfef" stroke-width="2.6" stroke-linecap="round" />

    <!-- Whiskers -->
    <line x1="16" y1="80" x2="36" y2="83" stroke="#c49bff" stroke-width="2" stroke-linecap="round" />
    <line x1="14" y1="90" x2="35" y2="90" stroke="#c49bff" stroke-width="2" stroke-linecap="round" />
    <line x1="154" y1="80" x2="134" y2="83" stroke="#c49bff" stroke-width="2" stroke-linecap="round" />
    <line x1="156" y1="90" x2="135" y2="90" stroke="#c49bff" stroke-width="2" stroke-linecap="round" />

    <!-- Little Paws Holding a Compressed Token Crystal -->
    <ellipse cx="62" cy="130" rx="13" ry="9" fill="#2e264e" stroke="#ff9ecd" stroke-width="2.5" />
    <ellipse cx="108" cy="130" rx="13" ry="9" fill="#2e264e" stroke="#ff9ecd" stroke-width="2.5" />

    <!-- Token Crystal / ObservationPack Badge -->
    <rect x="40" y="142" width="90" height="24" rx="12" fill="url(#badgeGrad)" />
    <text x="85" y="158" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" fill="#ffffff" text-anchor="middle">obs_nichi 🐾 -49%</text>
  </g>

  <!-- Right Side Title & Subtitles -->
  <g transform="translate(285, 62)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="355" height="26" rx="13" fill="#32285a" stroke="#c49bff" stroke-width="1.2" />
    <text x="177" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#ffcfef" text-anchor="middle">
      🐱 arXiv:2609.20519 (SoL-Pi) × Harness² • Nichi Edition uwu
    </text>

    <!-- Main Title -->
    <text x="0" y="70" font-family="system-ui, -apple-system, sans-serif" font-size="42" font-weight="800" fill="url(#accentGrad)">
      sol-pi-harness 🐾
    </text>

    <!-- Subtitle -->
    <text x="0" y="102" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="500" fill="#e6deff">
      Purr-fect Token Efficiency &amp; Zero-Bloat Harness for Coding Agents
    </text>

    <!-- Feature Chips -->
    <g transform="translate(0, 124)">
      <!-- Chip 1 -->
      <rect x="0" y="0" width="136" height="30" rx="8" fill="#231c40" stroke="#ff9ecd" stroke-width="1.5" />
      <text x="68" y="19" font-family="monospace" font-size="12" font-weight="bold" fill="#ff9ecd" text-anchor="middle">⚡ Action Fusion</text>

      <!-- Chip 2 -->
      <rect x="146" y="0" width="154" height="30" rx="8" fill="#231c40" stroke="#c49bff" stroke-width="1.5" />
      <text x="223" y="19" font-family="monospace" font-size="12" font-weight="bold" fill="#c49bff" text-anchor="middle">📦 ObservationPack</text>

      <!-- Chip 3 -->
      <rect x="310" y="0" width="156" height="30" rx="8" fill="#231c40" stroke="#7ef2e4" stroke-width="1.5" />
      <text x="388" y="19" font-family="monospace" font-size="12" font-weight="bold" fill="#7ef2e4" text-anchor="middle">🛡️ Verbatim Reducer</text>

      <!-- Chip 4 -->
      <rect x="476" y="0" width="125" height="30" rx="8" fill="#231c40" stroke="#ffd280" stroke-width="1.5" />
      <text x="538" y="19" font-family="monospace" font-size="12" font-weight="bold" fill="#ffd280" text-anchor="middle">🧹 Auto-Compact</text>
    </g>

    <!-- Compatibility Footer -->
    <text x="0" y="180" font-family="system-ui, sans-serif" font-size="13" fill="#b4a5e8">
      Works with: <tspan fill="#ffffff" font-weight="600">Antigravity (AGY)</tspan> • <tspan fill="#ffffff" font-weight="600">Claude Code</tspan> • <tspan fill="#ffffff" font-weight="600">OpenAI Codex</tspan> • <tspan fill="#ffffff" font-weight="600">Gemini CLI</tspan> • <tspan fill="#ffffff" font-weight="600">Cursor</tspan>
    </text>
  </g>
</svg>
